server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: cliente-service
          uri: http://localhost:9091
          predicates:
            - Path=/clientes/**

        - id: pedido-service
          uri: http://localhost:9092
          predicates:
            - Path=/pedidos/**
          
        - id: producto-service
          uri: http://localhost:9093
          predicates:
            - Path=/productos/**